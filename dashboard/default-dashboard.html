<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full text-center">
        <div class="mb-6">
            <i class="fas fa-exclamation-circle text-6xl text-yellow-500"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Dashboard Not Found</h1>
        <p class="text-gray-600 mb-6">
            The system could not determine the correct dashboard for your user role.
            <br>
            <span class="text-sm mt-2 block bg-red-50 text-red-700 p-2 rounded border border-red-200" id="role-debug">
                Detecting role...
            </span>
        </p>
        <script>
            const userType = sessionStorage.getItem('user_type');
            if (userType) {
                const charCodes = Array.from(userType).map(c => c.charCodeAt(0)).join(', ');
                document.getElementById('role-debug').innerHTML = `
                    Detected Role: <strong>'${userType}'</strong><br>
                    <span class="text-xs">Length: ${userType.length}, Codes: [${charCodes}]</span><br>
                    Please contact admin to map this role.
                `;
            } else {
                document.getElementById('role-debug').innerText = "Role could not be detected from session.";
            }
        </script>
        <div class="flex flex-col space-y-3">
            <a href="../logout.php"
                class="w-full bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition flex items-center justify-center">
                <i class="fas fa-sign-out-alt mr-2"></i> Logout
            </a>
            <a href="admin-dashboard.php"
                class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition flex items-center justify-center">
                <i class="fas fa-home mr-2"></i> Try Admin Dashboard
            </a>
        </div>
    </div>
</body>

</html>
